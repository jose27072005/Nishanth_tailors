<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cancelled Orders - Nishanth Tailors</title>
  <style>
    :root{
      --bg1: #0f1724;
      --bg2: #081126;
      --text: #e7f7ff;
      --muted: rgba(231,247,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Inter, ui-sans-serif, system-ui;
    }

    *{box-sizing:border-box; margin:0; padding:0}
    
    body{
      min-height:100vh;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(110,30,255,0.12), transparent 6%),
                  radial-gradient(900px 400px at 90% 80%, rgba(0,200,255,0.08), transparent 8%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      opacity:0;
      animation:page-enter 1000ms cubic-bezier(.25,.46,.45,.94) forwards;
      position:relative;
      overflow-x:hidden;
    }

    .premium-watermark{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:min(85vw, 600px);
      height:min(85vw, 600px);
      z-index:0;
      pointer-events:none;
      opacity:0.5;
    }

    .seal-outer{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:3px solid rgba(120,220,255,0.15);
      background:radial-gradient(circle at 30% 30%, rgba(120,220,255,0.08) 0%, transparent 60%);
      animation:seal-breathe 8s ease-in-out infinite;
      box-shadow:inset 0 0 80px rgba(120,220,255,0.08),
                 0 0 60px rgba(120,220,255,0.05);
    }

    @keyframes seal-breathe{
      0%, 100%{
        transform:scale(1);
        border-color:rgba(120,220,255,0.15);
      }
      50%{
        transform:scale(1.02);
        border-color:rgba(180,120,255,0.18);
      }
    }

    .seal-middle{
      position:absolute;
      inset:8%;
      border-radius:50%;
      border:2px solid rgba(180,120,255,0.12);
      animation:seal-rotate-slow 90s linear infinite;
    }

    .seal-middle::before{
      content:'';
      position:absolute;
      inset:-2px;
      border-radius:50%;
      background:conic-gradient(from 0deg, 
        transparent 0deg,
        rgba(120,220,255,0.1) 90deg,
        transparent 180deg,
        rgba(180,120,255,0.1) 270deg,
        transparent 360deg);
      animation:seal-rotate-slow 90s linear infinite;
    }

    @keyframes seal-rotate-slow{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    .seal-inner{
      position:absolute;
      inset:15%;
      border-radius:50%;
      border:2px dashed rgba(120,220,255,0.1);
      animation:seal-rotate-reverse 60s linear infinite;
    }

    @keyframes seal-rotate-reverse{
      from{transform:rotate(360deg)}
      to{transform:rotate(0deg)}
    }

    .seal-center{
      position:absolute;
      inset:25%;
      border-radius:50%;
      background:radial-gradient(circle, rgba(120,220,255,0.05) 0%, transparent 70%);
      border:1px solid rgba(120,220,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .watermark-text{
      position:absolute;
      width:120%;
      text-align:center;
      font-size:clamp(20px, 3.5vw, 42px);
      font-weight:900;
      letter-spacing:0.15em;
      line-height:1.4;
      background:linear-gradient(135deg, 
        #71e0ff 0%, 
        #b47bff 25%,
        #71e0ff 50%,
        #b47bff 75%,
        #71e0ff 100%);
      background-size:300% auto;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:premium-shimmer 8s ease-in-out infinite;
      filter:drop-shadow(0 0 20px rgba(120,220,255,0.15));
      opacity:0.9;
    }

    @keyframes premium-shimmer{
      0%, 100%{
        background-position:0% center;
        opacity:0.9;
      }
      50%{
        background-position:100% center;
        opacity:1;
      }
    }

    .corner-accent{
      position:absolute;
      width:15%;
      height:15%;
      border:2px solid rgba(120,220,255,0.12);
      opacity:0;
      animation:corner-fade 4s ease-in-out infinite;
    }

    .corner-accent:nth-child(1){
      top:5%;
      left:5%;
      border-right:none;
      border-bottom:none;
      border-radius:8px 0 0 0;
      animation-delay:0s;
    }

    .corner-accent:nth-child(2){
      top:5%;
      right:5%;
      border-left:none;
      border-bottom:none;
      border-radius:0 8px 0 0;
      animation-delay:1s;
    }

    .corner-accent:nth-child(3){
      bottom:5%;
      left:5%;
      border-right:none;
      border-top:none;
      border-radius:0 0 0 8px;
      animation-delay:2s;
    }

    .corner-accent:nth-child(4){
      bottom:5%;
      right:5%;
      border-left:none;
      border-top:none;
      border-radius:0 0 8px 0;
      animation-delay:3s;
    }

    @keyframes corner-fade{
      0%, 100%{opacity:0; transform:scale(0.8)}
      50%{opacity:0.6; transform:scale(1)}
    }

    .orbit-dots{
      position:absolute;
      inset:10%;
      border-radius:50%;
    }

    .orbit-dot{
      position:absolute;
      width:6px;
      height:6px;
      background:linear-gradient(135deg, rgba(120,220,255,0.4), rgba(180,120,255,0.4));
      border-radius:50%;
      top:0;
      left:50%;
      transform-origin:0 300%;
      animation:orbit 20s linear infinite;
      box-shadow:0 0 10px rgba(120,220,255,0.3);
    }

    .orbit-dot:nth-child(1){animation-delay:0s}
    .orbit-dot:nth-child(2){animation-delay:-5s}
    .orbit-dot:nth-child(3){animation-delay:-10s}
    .orbit-dot:nth-child(4){animation-delay:-15s}

    @keyframes orbit{
      from{transform:rotate(0deg) translateX(-3px)}
      to{transform:rotate(360deg) translateX(-3px)}
    }

    @keyframes page-enter{
      to{opacity:1}
    }

    /* Header */
    .header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:70px;
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border-bottom:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:100;
      display:flex;
      align-items:center;
      padding:0 40px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      justify-content:space-between;
    }

    .header-left{
      display:flex;
      align-items:center;
    }

    .back-btn{
      width:44px;
      height:44px;
      border-radius:12px;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      margin-right:20px;
    }

    .back-btn:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      transform:translateX(-4px);
    }

    .header-title{
      font-size:22px;
      font-weight:700;
      letter-spacing:0.5px;
    }

    .language-switch {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-btn {
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 300ms ease;
    }

    .language-btn.active {
      background: linear-gradient(135deg, rgba(120,220,255,0.3), rgba(180,120,255,0.3));
      border-color: rgba(120,220,255,0.4);
    }

    .language-btn:hover {
      transform: translateY(-2px);
    }

    /* Container */
    .container{
      max-width:1200px;
      margin:0 auto;
      padding:100px 20px 40px;
      position:relative;
      z-index:1;
    }

    /* Search Section */
    .search-section{
      margin-bottom:32px;
    }

    .search-container{
      position:relative;
      display:flex;
      gap:16px;
      align-items:center;
    }

    .search-input{
      flex:1;
      height:56px;
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:16px;
      padding:0 20px;
      font-size:16px;
      color:var(--text);
      font-family:inherit;
      transition:all 400ms cubic-bezier(.34,.46,.45,.94);
    }

    .search-input:focus{
      outline:none;
      border-color:rgba(120,220,255,0.5);
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
      box-shadow:0 0 0 4px rgba(120,220,255,0.1);
    }

    .search-input::placeholder{
      color:rgba(231,247,255,0.4);
    }

    .search-btn{
      height:56px;
      padding:0 32px;
      border-radius:14px;
      border:none;
      font-size:15px;
      font-weight:600;
      font-family:inherit;
      cursor:pointer;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      letter-spacing:0.3px;
      background:linear-gradient(135deg, rgba(120,220,255,0.3), rgba(180,120,255,0.3));
      color:var(--text);
      border:1px solid rgba(120,220,255,0.4);
    }

    .search-btn:hover{
      background:linear-gradient(135deg, rgba(120,220,255,0.4), rgba(180,120,255,0.4));
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(120,220,255,0.3);
    }

    .search-stats{
      margin-top:12px;
      font-size:14px;
      color:var(--muted);
    }

    /* Suggestions Dropdown */
    .suggestions-dropdown{
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;
      margin-top:4px;
      max-height:200px;
      overflow-y:auto;
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:10;
      display:none;
    }

    .suggestions-dropdown.active{
      display:block;
      animation:dropdown-enter 300ms cubic-bezier(0.34, 0.46, 0.45, 0.94);
    }

    @keyframes dropdown-enter{
      from{opacity:0; transform:translateY(-10px)}
      to{opacity:1; transform:translateY(0)}
    }

    .suggestion-item{
      padding:12px 16px;
      cursor:pointer;
      transition:all 200ms ease;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .suggestion-item:hover{
      background:rgba(255,255,255,0.1);
    }

    .suggestion-item:last-child{
      border-bottom:none;
    }

    /* Orders Grid */
    .orders-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      gap:20px;
    }

    .order-card{
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:24px;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      cursor:pointer;
      transition:all 400ms cubic-bezier(.34,.46,.45,.94);
      transform:translateY(20px);
      opacity:0;
      animation:card-enter 600ms cubic-bezier(.25,.46,.45,.94) forwards;
    }

    @keyframes card-enter{
      to{transform:translateY(0); opacity:1}
    }

    .order-card:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      transform:translateY(-4px);
      box-shadow:0 12px 40px rgba(255,100,100,0.2);
    }

    .bill-no{
      font-size:28px;
      font-weight:800;
      background:linear-gradient(135deg, #ff6b6b, #ffa8a8);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:16px;
      letter-spacing:1px;
    }

    .order-info{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }

    .info-label{
      color:var(--muted);
      font-weight:500;
    }

    .info-value{
      color:var(--text);
      font-weight:600;
    }

    .cancelled-badge{
      display:inline-block;
      padding:6px 14px;
      background:linear-gradient(135deg, rgba(255,123,123,0.3), rgba(255,77,77,0.3));
      border:1px solid rgba(255,123,123,0.4);
      border-radius:12px;
      font-size:12px;
      font-weight:700;
      margin-top:12px;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    /* Time badge */
    .time-badge{
      display:inline-block;
      padding:4px 10px;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.2);
      border-radius:8px;
      font-size:11px;
      font-weight:600;
      margin-top:6px;
      color:var(--muted);
    }

    /* Payment Information Styles */
    .payment-info-section {
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(120,220,255,0.15), rgba(180,120,255,0.1));
      border: 1px solid rgba(120,220,255,0.3);
      border-radius: 16px;
    }

    .payment-info-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      text-align: center;
    }

    .payment-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .payment-detail {
      text-align: center;
      padding: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .payment-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .payment-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .advance-amount {
      color: #6bff9e;
    }

    .balance-amount {
      color: #ffba08;
    }

    .payment-method {
      color: #71e0ff;
    }

    .payment-status {
      color: #b47bff;
    }

    .balance-section {
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(255,180,120,0.2), rgba(255,120,180,0.2));
      border: 1px solid rgba(255,180,120,0.3);
      border-radius: 12px;
      text-align: center;
    }

    .balance-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 24px;
      font-weight: 800;
      color: #ffba08;
    }

    .paid-badge {
      display: inline-block;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(100,255,150,0.3), rgba(63,230,167,0.2));
      border: 1px solid rgba(100,255,150,0.4);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #6bff9e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Detail Modal */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(4,8,18,0.95);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:200;
      place-items:center;
      opacity:0;
      transition:opacity 400ms cubic-bezier(.25,.46,.45,.94);
      overflow-y:auto;
      padding:20px;
    }

    .modal.active{
      display:grid;
      opacity:1;
    }

    .modal-content{
      background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border:1.5px solid rgba(255,255,255,0.15);
      border-radius:28px;
      padding:40px;
      max-width:700px;
      width:100%;
      transform:scale(0.9) translateY(30px);
      transition:transform 600ms cubic-bezier(.34,.46,.45,.94);
      max-height:90vh;
      overflow-y:auto;
    }

    .modal.active .modal-content{
      transform:scale(1) translateY(0);
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:32px;
    }

    .modal-bill-no{
      font-size:36px;
      font-weight:800;
      background:linear-gradient(135deg, #ff6b6b, #ffa8a8);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .close-btn{
      width:40px;
      height:40px;
      border-radius:10px;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      font-size:24px;
      color:var(--text);
    }

    .close-btn:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      transform:rotate(90deg);
    }

    .detail-section{
      margin-bottom:24px;
    }

    .detail-title{
      font-size:14px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:8px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .detail-value{
      font-size:18px;
      font-weight:600;
      color:var(--text);
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .cancellation-info{
      margin-top:32px;
      padding:20px;
      background:linear-gradient(135deg, rgba(255,123,123,0.2), rgba(255,77,77,0.2));
      border:1px solid rgba(255,123,123,0.3);
      border-radius:16px;
      text-align:center;
    }

    .cancellation-icon{
      font-size:48px;
      margin-bottom:12px;
    }

    .cancellation-text{
      font-size:16px;
      font-weight:600;
      color:var(--text);
      margin-bottom:8px;
    }

    .cancellation-date{
      font-size:14px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .cancellation-time{
      font-size:14px;
      color:var(--muted);
      font-weight:600;
    }

    /* Empty state */
    .empty-state{
      text-align:center;
      padding:80px 20px;
    }

    .empty-icon{
      font-size:80px;
      margin-bottom:24px;
      opacity:0.5;
    }

    .empty-text{
      font-size:20px;
      font-weight:600;
      color:var(--muted);
    }

    /* Loading state */
    .loading{
      text-align:center;
      padding:40px 20px;
      color:var(--muted);
    }

    /* Page transition */
    body.transitioning{
      animation:page-exit 600ms cubic-bezier(.55,.055,.675,.19) forwards;
    }

    @keyframes page-exit{
      to{opacity:0; transform:scale(1.02)}
    }

    /* Responsive */
    @media (max-width:640px){
      .header{
        padding:0 20px;
      }
      .container{
        padding:100px 16px 40px;
      }
      .search-container{
        flex-direction:column;
      }
      .search-input{
        width:100%;
      }
      .search-btn{
        width:100%;
      }
      .orders-grid{
        grid-template-columns:1fr;
      }
      .modal-content{
        padding:32px 24px;
      }
      .language-switch {
        gap: 5px;
      }
      .language-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
      .payment-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="header-title" data-english="Cancelled Orders" data-tamil="ரத்து செய்யப்பட்ட ஆர்டர்கள்">Cancelled Orders</h1>
    </div>
    <div class="language-switch">
      <button class="language-btn active" id="englishBtn">English</button>
      <button class="language-btn" id="tamilBtn">தமிழ்</button>
    </div>
  </header>

  <!-- Premium Watermark -->
  <div class="premium-watermark">
    <div class="seal-outer"></div>
    <div class="seal-middle"></div>
    <div class="seal-inner"></div>
    <div class="seal-center">
      <div class="watermark-text">NISHANTH<br>TAILORS</div>
    </div>
    <div class="corner-accent"></div>
    <div class="corner-accent"></div>
    <div class="corner-accent"></div>
    <div class="corner-accent"></div>
    <div class="orbit-dots">
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
      <div class="orbit-dot"></div>
    </div>
  </div>

  <!-- Container -->
  <div class="container">
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-container">
        <input type="text" class="search-input" id="searchInput" data-placeholder-english="Search by bill number, customer name, or mobile number..." data-placeholder-tamil="பில் எண், வாடிக்கையாளர் பெயர் அல்லது மொபைல் எண் மூலம் தேடுங்கள்..." placeholder="Search by bill number, customer name, or mobile number..." />
        <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
        <button class="search-btn" id="searchBtn" data-english="Search" data-tamil="தேடு">Search</button>
      </div>
      <div class="search-stats" id="searchStats" data-english="Loading cancelled orders..." data-tamil="ரத்து செய்யப்பட்ட ஆர்டர்களை ஏற்றுகிறது...">Loading cancelled orders...</div>
    </div>

    <!-- Orders Grid -->
    <div class="orders-grid" id="ordersGrid">
      <div class="loading" data-english="Loading cancelled orders..." data-tamil="ரத்து செய்யப்பட்ட ஆர்டர்களை ஏற்றுகிறது...">Loading cancelled orders...</div>
    </div>
    
    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-icon">❌</div>
      <p class="empty-text" data-english="No cancelled orders found" data-tamil="ரத்து செய்யப்பட்ட ஆர்டர்கள் எதுவும் இல்லை">No cancelled orders found</p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-bill-no" id="modalBillNo"></h2>
        <button class="close-btn" id="closeBtn">×</button>
      </div>

      <div class="detail-section">
        <div class="detail-title" data-english="Customer Name" data-tamil="வாடிக்கையாளர் பெயர்">Customer Name</div>
        <div class="detail-value" id="modalCustomerName"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title" data-english="Mobile Number" data-tamil="மொபைல் எண்">Mobile Number</div>
        <div class="detail-value" id="modalMobile"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title" data-english="Billing Date" data-tamil="பில் தேதி">Billing Date</div>
        <div class="detail-value" id="modalBillingDate"></div>
      </div>

      <div class="detail-section">
        <div class="detail-title" data-english="Deadline" data-tamil="காலக்கெடு">Deadline</div>
        <div class="detail-value" id="modalDeadline"></div>
      </div>

      <!-- Payment Information Section -->
      <div class="payment-info-section" id="paymentInfoSection">
        <div class="payment-info-title" data-english="Payment Information" data-tamil="கட்டண தகவல்">Payment Information</div>
        <div class="payment-details">
          <div class="payment-detail">
            <div class="payment-label" data-english="Total Amount" data-tamil="மொத்த தொகை">Total Amount</div>
            <div class="payment-value advance-amount" id="totalAmount">₹0</div>
          </div>
          <div class="payment-detail">
            <div class="payment-label" data-english="Advance Amount" data-tamil="முன்பணத் தொகை">Advance Amount</div>
            <div class="payment-value advance-amount" id="advanceAmount">₹0</div>
          </div>
          <div class="payment-detail">
            <div class="payment-label" data-english="Balance Amount" data-tamil="இருப்புத் தொகை">Balance Amount</div>
            <div class="payment-value balance-amount" id="balanceAmount">₹0</div>
          </div>
          <div class="payment-detail">
            <div class="payment-label" data-english="Payment Method" data-tamil="கட்டண முறை">Payment Method</div>
            <div class="payment-value payment-method" id="paymentMethod">-</div>
          </div>
        </div>
        <div class="balance-section" id="balanceSection">
          <div class="balance-label" data-english="Refund Amount" data-tamil="திரும்பப் பெற வேண்டிய தொகை">Refund Amount</div>
          <div class="balance-value" id="refundAmount">₹0</div>
        </div>
      </div>

      <div class="cancellation-info">
        <div class="cancellation-icon">✕</div>
        <div class="cancellation-text" data-english="Order Cancelled" data-tamil="ஆர்டர் ரத்து செய்யப்பட்டது">Order Cancelled</div>
        <div class="cancellation-date" id="modalCancellationDate"></div>
        <div class="cancellation-time" id="modalCancellationTime"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, query, where, getDocs, Timestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDBW-WpSJIFT4ndQ87rbQ0UGXWBO6cYSF0",
      authDomain: "daddy-3-f04d0.firebaseapp.com",
      projectId: "daddy-3-f04d0",
      storageBucket: "daddy-3-f04d0.firebasestorage.app",
      messagingSenderId: "700872095381",
      appId: "1:700872095381:web:6682b09fa7103e11d00d9c",
      measurementId: "G-2NJHM6SCCC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let cancelledOrders = [];
    let filteredOrders = [];
    let allCancelledBills = [];
    let currentLanguage = 'english';

    // Language Switch Event Listeners
    document.getElementById('englishBtn').addEventListener('click', () => {
      switchLanguage('english');
    });

    document.getElementById('tamilBtn').addEventListener('click', () => {
      switchLanguage('tamil');
    });

    function switchLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('preferredLanguage', lang); // Save preference

      document.getElementById('englishBtn').classList.toggle('active', lang === 'english');
      document.getElementById('tamilBtn').classList.toggle('active', lang === 'tamil');

      document.querySelectorAll('[data-english]').forEach(element => {
        element.textContent = lang === 'english'
          ? element.getAttribute('data-english')
          : element.getAttribute('data-tamil');
      });

      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = lang === 'english'
        ? searchInput.getAttribute('data-placeholder-english')
        : searchInput.getAttribute('data-placeholder-tamil');

      displayOrders();
      updateSearchStats();
    }

    // Load preferred language from localStorage on page load
    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLanguage');
      switchLanguage(savedLang === 'tamil' ? 'tamil' : 'english');
    });

    // Load all cancelled orders for suggestions
    async function loadAllCancelledBills() {
      try {
        const q = query(collection(db, 'bills'), where('status', '==', 'Cancelled'));
        const querySnapshot = await getDocs(q);
        allCancelledBills = [];
        
        querySnapshot.forEach((doc) => {
          const billData = doc.data();
          allCancelledBills.push({
            id: doc.id,
            ...billData
          });
        });
      } catch (error) {
        console.error('Error loading cancelled bills:', error);
      }
    }

    // Search suggestions
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      const dropdown = document.getElementById('suggestionsDropdown');
      
      if (searchTerm.length === 0) {
        dropdown.classList.remove('active');
        return;
      }

      const filteredBills = allCancelledBills.filter(bill => 
        (bill.billNo && bill.billNo.toLowerCase().includes(searchTerm)) ||
        (bill.customerName && bill.customerName.toLowerCase().includes(searchTerm)) ||
        (bill.mobileNo && bill.mobileNo.includes(searchTerm))
      ).slice(0, 5); // Limit to 5 suggestions

      if (filteredBills.length === 0) {
        dropdown.classList.remove('active');
        return;
      }

      const unknownCustomer = currentLanguage === 'english' ? 'Unknown Customer' : 'அறியப்படாத வாடிக்கையாளர்';
      const noMobile = currentLanguage === 'english' ? 'No Mobile' : 'மொபைல் இல்லை';

      dropdown.innerHTML = filteredBills.map(bill => `
        <div class="suggestion-item" data-billno="${bill.billNo}">
          ${bill.billNo} - ${bill.customerName || unknownCustomer} (${bill.mobileNo || noMobile})
        </div>
      `).join('');

      dropdown.classList.add('active');

      // Add click handlers to suggestions
      dropdown.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          const billNo = item.getAttribute('data-billno');
          document.getElementById('searchInput').value = billNo;
          dropdown.classList.remove('active');
          searchOrders();
        });
      });
    });

    // Close suggestions when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container')) {
        document.getElementById('suggestionsDropdown').classList.remove('active');
      }
    });

    // Load cancelled orders from Firestore
    async function loadCancelledOrders(){
      const grid = document.getElementById('ordersGrid');
      const emptyState = document.getElementById('emptyState');
      const searchStats = document.getElementById('searchStats');

      try {
        const q = query(collection(db, 'bills'), where('status', '==', 'Cancelled'));
        const querySnapshot = await getDocs(q);
        cancelledOrders = [];
        
        const unknownCustomer = currentLanguage === 'english' ? 'Unknown Customer' : 'அறியப்படாத வாடிக்கையாளர்';
        
        querySnapshot.forEach((doc) => {
          const orderData = doc.data();
          
          // Calculate balance amount
          const totalAmount = orderData.totalAmount || 0;
          const advanceAmount = orderData.advanceAmount || 0;
          const balanceAmount = totalAmount - advanceAmount;
          
          cancelledOrders.push({
            id: doc.id,
            billNo: orderData.billNo || 'N/A',
            customerName: orderData.customerName || unknownCustomer,
            mobileNo: orderData.mobileNo || 'N/A',
            billingDate: orderData.billingDate || null,
            deadlineDate: orderData.deadlineDate || null,
            cancelledDate: orderData.cancelledDate || null,
            totalAmount: totalAmount,
            advanceAmount: advanceAmount,
            balanceAmount: balanceAmount,
            paymentMethod: orderData.paymentMethod || 'Cash',
            status: orderData.status || 'Unknown'
          });
        });

        // Sort by cancellation date (newest first)
        cancelledOrders.sort((a, b) => {
          const dateA = convertToDate(a.cancelledDate);
          const dateB = convertToDate(b.cancelledDate);
          
          if (!dateA && !dateB) return 0;
          if (!dateA) return 1;
          if (!dateB) return -1;
          
          return dateB.getTime() - dateA.getTime();
        });

        filteredOrders = [...cancelledOrders];
        displayOrders();
        updateSearchStats();

      } catch (error) {
        console.error('Error loading cancelled orders:', error);
        const errorMsg = currentLanguage === 'english' ? 
          'Error loading orders. Please check console for details.' : 
          'ஆர்டர்களை ஏற்றும் போது பிழை. விவரங்களுக்கு கன்சோல் சரிபார்க்கவும்.';
        grid.innerHTML = `<div class="loading">${errorMsg}</div>`;
        searchStats.textContent = currentLanguage === 'english' ? 'Error loading orders' : 'ஆர்டர்களை ஏற்றும் போது பிழை';
      }
    }

    // Helper function to convert Firestore Timestamp to Date
    function convertToDate(dateValue) {
      if (!dateValue) return null;
      
      if (dateValue instanceof Timestamp) {
        return dateValue.toDate();
      }
      
      if (dateValue instanceof Date) {
        return dateValue;
      }
      
      if (typeof dateValue === 'string') {
        const date = new Date(dateValue);
        return isNaN(date.getTime()) ? null : date;
      }
      
      if (typeof dateValue === 'number') {
        return new Date(dateValue);
      }
      
      return null;
    }

    // Display orders in the grid
    function displayOrders() {
      const grid = document.getElementById('ordersGrid');
      const emptyState = document.getElementById('emptyState');

      if(filteredOrders.length === 0){
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = '';

      const customerLabel = currentLanguage === 'english' ? 'Customer' : 'வாடிக்கையாளர்';
      const mobileLabel = currentLanguage === 'english' ? 'Mobile' : 'மொபைல்';
      const cancelledOnLabel = currentLanguage === 'english' ? 'Cancelled On' : 'ரத்து செய்யப்பட்ட நாள்';
      const cancelledBadge = currentLanguage === 'english' ? 'Cancelled' : 'ரத்து செய்யப்பட்டது';
      const totalAmountLabel = currentLanguage === 'english' ? 'Total Amount' : 'மொத்த தொகை';
      const advanceLabel = currentLanguage === 'english' ? 'Advance' : 'முன்பணம்';
      const balanceLabel = currentLanguage === 'english' ? 'Balance' : 'இருப்பு';

      // Populate orders grid
      filteredOrders.forEach((order, index) => {
        const orderCard = document.createElement('div');
        orderCard.className = 'order-card';
        orderCard.style.animationDelay = `${index * 100}ms`;
        orderCard.onclick = () => showOrderDetail(order.billNo);
        
        const { dateString, timeString } = formatDateTime(order.cancelledDate);
        
        orderCard.innerHTML = `
          <div class="bill-no">${order.billNo}</div>
          <div class="order-info">
            <div class="info-row">
              <span class="info-label">${customerLabel}</span>
              <span class="info-value">${order.customerName}</span>
            </div>
            <div class="info-row">
              <span class="info-label">${mobileLabel}</span>
              <span class="info-value">${order.mobileNo}</span>
            </div>
            <div class="info-row">
              <span class="info-label">${totalAmountLabel}</span>
              <span class="info-value">₹${order.totalAmount}</span>
            </div>
            <div class="info-row">
              <span class="info-label">${advanceLabel}</span>
              <span class="info-value">₹${order.advanceAmount}</span>
            </div>
            <div class="info-row">
              <span class="info-label">${balanceLabel}</span>
              <span class="info-value" style="color:${order.balanceAmount > 0 ? '#ffba08' : '#6bff9e'}">₹${order.balanceAmount}</span>
            </div>
            <div class="info-row">
              <span class="info-label">${cancelledOnLabel}</span>
              <span class="info-value">${dateString}</span>
            </div>
          </div>
          <span class="cancelled-badge">✕ ${cancelledBadge}</span>
          <div class="time-badge">${timeString}</div>
        `;
        
        grid.appendChild(orderCard);
      });
    }

    // Search functionality
    function searchOrders() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      
      if(!searchTerm) {
        filteredOrders = [...cancelledOrders];
      } else {
        filteredOrders = cancelledOrders.filter(order => 
          order.billNo.toLowerCase().includes(searchTerm) ||
          order.customerName.toLowerCase().includes(searchTerm) ||
          (order.mobileNo && order.mobileNo.includes(searchTerm))
        );
      }
      
      displayOrders();
      updateSearchStats();
    }

    // Update search statistics
    function updateSearchStats() {
      const searchStats = document.getElementById('searchStats');
      const searchTerm = document.getElementById('searchInput').value.trim();
      
      if(searchTerm) {
        if(currentLanguage === 'english') {
          searchStats.textContent = `Found ${filteredOrders.length} of ${cancelledOrders.length} cancelled orders matching "${searchTerm}"`;
        } else {
          searchStats.textContent = `"${searchTerm}" பொருந்தும் ${cancelledOrders.length} இல் ${filteredOrders.length} ரத்து செய்யப்பட்ட ஆர்டர்கள் கிடைத்தன`;
        }
      } else {
        if(currentLanguage === 'english') {
          searchStats.textContent = `Showing ${filteredOrders.length} cancelled orders`;
        } else {
          searchStats.textContent = `${filteredOrders.length} ரத்து செய்யப்பட்ட ஆர்டர்கள் காட்டப்படுகின்றன`;
        }
      }
    }

    // Format date and time for display - handles Firestore Timestamps
    function formatDateTime(dateValue) {
      const date = convertToDate(dateValue);
      
      if (!date) {
        return { 
          dateString: currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை', 
          timeString: currentLanguage === 'english' ? 'Unknown time' : 'நேரம் தெரியவில்லை' 
        };
      }
      
      try {
        const dateString = date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        
        const timeString = date.toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        });
        
        return { dateString, timeString };
      } catch (error) {
        console.error('Error formatting date/time:', error, dateValue);
        return { 
          dateString: currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை', 
          timeString: currentLanguage === 'english' ? 'Unknown time' : 'நேரம் தெரியவில்லை' 
        };
      }
    }

    // Format just date for display (for older fields)
    function formatDate(dateValue) {
      const date = convertToDate(dateValue);
      
      if (!date) {
        return currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை';
      }
      
      try {
        return date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      } catch (error) {
        console.error('Error formatting date:', error, dateValue);
        return currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை';
      }
    }

    // Show order detail
    function showOrderDetail(billNo) {
      const order = cancelledOrders.find(o => o.billNo === billNo);
      if(!order) return;

      document.getElementById('modalBillNo').textContent = order.billNo;
      document.getElementById('modalCustomerName').textContent = order.customerName;
      document.getElementById('modalMobile').textContent = order.mobileNo;
      document.getElementById('modalBillingDate').textContent = formatDate(order.billingDate);
      document.getElementById('modalDeadline').textContent = formatDate(order.deadlineDate);
      
      // Update payment information
      document.getElementById('totalAmount').textContent = `₹${order.totalAmount}`;
      document.getElementById('advanceAmount').textContent = `₹${order.advanceAmount}`;
      document.getElementById('balanceAmount').textContent = `₹${order.balanceAmount}`;
      document.getElementById('paymentMethod').textContent = order.paymentMethod || 'Cash';
      
      // Calculate refund amount (if advance is more than balance)
      const refundAmount = order.advanceAmount > order.balanceAmount ? order.advanceAmount - order.balanceAmount : 0;
      document.getElementById('refundAmount').textContent = `₹${refundAmount}`;
      
      const { dateString, timeString } = formatDateTime(order.cancelledDate);
      if(currentLanguage === 'english') {
        document.getElementById('modalCancellationDate').textContent = `Cancelled on ${dateString}`;
        document.getElementById('modalCancellationTime').textContent = `at ${timeString}`;
      } else {
        document.getElementById('modalCancellationDate').textContent = `${dateString} அன்று ரத்து செய்யப்பட்டது`;
        document.getElementById('modalCancellationTime').textContent = `${timeString} மணிக்கு`;
      }

      document.getElementById('detailModal').classList.add('active');
    }

    // Event Listeners
    document.getElementById('searchBtn').addEventListener('click', searchOrders);
    
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') {
        searchOrders();
      }
    });

    document.getElementById('searchInput').addEventListener('input', () => {
      if(document.getElementById('searchInput').value.trim() === '') {
        searchOrders();
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('active');
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if(e.target.id === 'detailModal'){
        document.getElementById('detailModal').classList.remove('active');
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      document.body.classList.add('transitioning');
      setTimeout(() => window.location.href = 'workspace.html', 600);
    });

    // Load orders on page load
    loadCancelledOrders();
    loadAllCancelledBills();
  </script>
</body>
</html>
