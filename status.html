<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Status Orders - Nishanth Tailors</title>
  <style>
    :root{
      --bg1: #0f1724;
      --bg2: #081126;
      --text: #e7f7ff;
      --muted: rgba(231,247,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Inter, ui-sans-serif, system-ui;
    }

    *{box-sizing:border-box; margin:0; padding:0}
    
    body{
      min-height:100vh;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(110,30,255,0.12), transparent 6%),
                  radial-gradient(900px 400px at 90% 80%, rgba(0,200,255,0.08), transparent 8%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      opacity:0;
      animation:page-enter 1000ms cubic-bezier(.25,.46,.45,.94) forwards;
      position:relative;
      overflow-x:hidden;
    }

    .premium-watermark{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:min(85vw, 600px);
      height:min(85vw, 600px);
      z-index:0;
      pointer-events:none;
      opacity:0.5;
    }

    .seal-outer{
      position:absolute;
      inset:0;
      border-radius:50%;
      border:3px solid rgba(120,220,255,0.15);
      background:radial-gradient(circle at 30% 30%, rgba(120,220,255,0.08) 0%, transparent 60%);
      animation:seal-breathe 8s ease-in-out infinite;
      box-shadow:inset 0 0 80px rgba(120,220,255,0.08),
                 0 0 60px rgba(120,220,255,0.05);
    }

    @keyframes seal-breathe{
      0%, 100%{
        transform:scale(1);
        border-color:rgba(120,220,255,0.15);
      }
      50%{
        transform:scale(1.02);
        border-color:rgba(180,120,255,0.18);
      }
    }

    .seal-middle{
      position:absolute;
      inset:8%;
      border-radius:50%;
      border:2px solid rgba(180,120,255,0.12);
      animation:seal-rotate-slow 90s linear infinite;
    }

    .seal-middle::before{
      content:'';
      position:absolute;
      inset:-2px;
      border-radius:50%;
      background:conic-gradient(from 0deg, 
        transparent 0deg,
        rgba(120,220,255,0.1) 90deg,
        transparent 180deg,
        rgba(180,120,255,0.1) 270deg,
        transparent 360deg);
      animation:seal-rotate-slow 90s linear infinite;
    }

    @keyframes seal-rotate-slow{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    .seal-inner{
      position:absolute;
      inset:15%;
      border-radius:50%;
      border:2px dashed rgba(120,220,255,0.1);
      animation:seal-rotate-reverse 60s linear infinite;
    }

    @keyframes seal-rotate-reverse{
      from{transform:rotate(360deg)}
      to{transform:rotate(0deg)}
    }

    .seal-center{
      position:absolute;
      inset:25%;
      border-radius:50%;
      background:radial-gradient(circle, rgba(120,220,255,0.05) 0%, transparent 70%);
      border:1px solid rgba(120,220,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

   .watermark-text{
  position:absolute;
  width:120%;
  text-align:center;
  font-size:clamp(20px, 3.5vw, 42px);
  font-weight:900;
  letter-spacing:0.15em;
  line-height:1.4;
  background:linear-gradient(135deg, 
    #71e0ff 0%, 
    #b47bff 25%,
    #71e0ff 50%,
    #b47bff 75%,
    #71e0ff 100%);
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:premium-shimmer 8s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(120,220,255,0.15));
  opacity:0.9;
}

    @keyframes premium-shimmer{
      0%, 100%{
        background-position:0% center;
        opacity:0.9;
      }
      50%{
        background-position:100% center;
        opacity:1;
      }
    }

    .corner-accent{
      position:absolute;
      width:15%;
      height:15%;
      border:2px solid rgba(120,220,255,0.12);
      opacity:0;
      animation:corner-fade 4s ease-in-out infinite;
    }

    .corner-accent:nth-child(1){
      top:5%;
      left:5%;
      border-right:none;
      border-bottom:none;
      border-radius:8px 0 0 0;
      animation-delay:0s;
    }

    .corner-accent:nth-child(2){
      top:5%;
      right:5%;
      border-left:none;
      border-bottom:none;
      border-radius:0 8px 0 0;
      animation-delay:1s;
    }

    .corner-accent:nth-child(3){
      bottom:5%;
      left:5%;
      border-right:none;
      border-top:none;
      border-radius:0 0 0 8px;
      animation-delay:2s;
    }

    .corner-accent:nth-child(4){
      bottom:5%;
      right:5%;
      border-left:none;
      border-top:none;
      border-radius:0 0 8px 0;
      animation-delay:3s;
    }

    @keyframes corner-fade{
      0%, 100%{opacity:0; transform:scale(0.8)}
      50%{opacity:0.6; transform:scale(1)}
    }

    .orbit-dots{
      position:absolute;
      inset:10%;
      border-radius:50%;
    }

    .orbit-dot{
      position:absolute;
      width:6px;
      height:6px;
      background:linear-gradient(135deg, rgba(120,220,255,0.4), rgba(180,120,255,0.4));
      border-radius:50%;
      top:0;
      left:50%;
      transform-origin:0 300%;
      animation:orbit 20s linear infinite;
      box-shadow:0 0 10px rgba(120,220,255,0.3);
    }

    .orbit-dot:nth-child(1){animation-delay:0s}
    .orbit-dot:nth-child(2){animation-delay:-5s}
    .orbit-dot:nth-child(3){animation-delay:-10s}
    .orbit-dot:nth-child(4){animation-delay:-15s}

    @keyframes orbit{
      from{transform:rotate(0deg) translateX(-3px)}
      to{transform:rotate(360deg) translateX(-3px)}
    }

    @keyframes page-enter{
      to{opacity:1}
    }

    .header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:70px;
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border-bottom:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:100;
      display:flex;
      align-items:center;
      padding:0 40px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      justify-content:space-between;
    }

    .header-left{
      display:flex;
      align-items:center;
    }

    .back-btn{
      width:44px;
      height:44px;
      border-radius:12px;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      margin-right:20px;
    }

    .back-btn:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      transform:translateX(-4px);
    }

    .header-title{
      font-size:22px;
      font-weight:700;
      letter-spacing:0.5px;
    }

    .language-switch {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-btn {
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 300ms ease;
    }

    .language-btn.active {
      background: linear-gradient(135deg, rgba(120,220,255,0.3), rgba(180,120,255,0.3));
      border-color: rgba(120,220,255,0.4);
    }

    .language-btn:hover {
      transform: translateY(-2px);
    }

    .container{
      max-width:1200px;
      margin:0 auto;
      padding:100px 20px 40px;
      position:relative;
      z-index:1;
    }

    .search-section{
      margin-bottom:32px;
    }

    .search-container{
      position:relative;
      display:flex;
      gap:16px;
      align-items:center;
    }

    .search-input{
      flex:1;
      height:56px;
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:16px;
      padding:0 20px;
      font-size:16px;
      color:var(--text);
      font-family:inherit;
      transition:all 400ms cubic-bezier(.34,.46,.45,.94);
    }

    .search-input:focus{
      outline:none;
      border-color:rgba(120,220,255,0.5);
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
      box-shadow:0 0 0 4px rgba(120,220,255,0.1);
    }

    .search-input::placeholder{
      color:rgba(231,247,255,0.4);
    }

    .search-btn{
      height:56px;
      padding:0 32px;
      border-radius:14px;
      border:none;
      font-size:15px;
      font-weight:600;
      font-family:inherit;
      cursor:pointer;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      letter-spacing:0.3px;
      background:linear-gradient(135deg, rgba(120,220,255,0.3), rgba(180,120,255,0.3));
      color:var(--text);
      border:1px solid rgba(120,220,255,0.4);
    }

    .search-btn:hover{
      background:linear-gradient(135deg, rgba(120,220,255,0.4), rgba(180,120,255,0.4));
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(120,220,255,0.3);
    }

    .search-stats{
      margin-top:12px;
      font-size:14px;
      color:var(--muted);
    }

    .suggestions-dropdown{
      position:absolute;
      top:100%;
      left:0;
      right:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;
      margin-top:4px;
      max-height:200px;
      overflow-y:auto;
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:10;
      display:none;
    }

    .suggestions-dropdown.active{
      display:block;
      animation:dropdown-enter 300ms cubic-bezier(0.34, 0.46, 0.45, 0.94);
    }

    @keyframes dropdown-enter{
      from{opacity:0; transform:translateY(-10px)}
      to{opacity:1; transform:translateY(0)}
    }

    .suggestion-item{
      padding:12px 16px;
      cursor:pointer;
      transition:all 200ms ease;
      border-bottom:1px solid rgba(255,255,255,0.05);
      font-size:16px;
      font-weight:600;
    }

    .suggestion-item:hover{
      background:rgba(255,255,255,0.1);
    }

    .suggestion-item:last-child{
      border-bottom:none;
    }

    .orders-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      gap:20px;
    }

    .order-card{
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:24px;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      cursor:pointer;
      transition:all 400ms cubic-bezier(.34,.46,.45,.94);
      transform:translateY(20px);
      opacity:0;
      animation:card-enter 600ms cubic-bezier(.25,.46,.45,.94) forwards;
    }

    @keyframes card-enter{
      to{transform:translateY(0); opacity:1}
    }

    .order-card:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      transform:translateY(-4px);
      box-shadow:0 12px 40px rgba(120,220,255,0.2);
    }

    .bill-no{
      font-size:28px;
      font-weight:800;
      background:linear-gradient(135deg, #71e0ff, #b47bff);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:16px;
      letter-spacing:1px;
    }

    .order-info{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }

    .info-label{
      color:var(--muted);
      font-weight:500;
    }

    .info-value{
      color:var(--text);
      font-weight:600;
    }

    .status-badge{
      display:inline-block;
      padding:6px 14px;
      border-radius:12px;
      font-size:12px;
      font-weight:700;
      margin-top:12px;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .empty-state{
      text-align:center;
      padding:80px 20px;
    }

    .empty-icon{
      font-size:80px;
      margin-bottom:24px;
      opacity:0.5;
    }

    .empty-text{
      font-size:20px;
      font-weight:600;
      color:var(--muted);
    }

    .loading{
      text-align:center;
      padding:40px 20px;
      color:var(--muted);
    }

    body.transitioning{
      animation:page-exit 600ms cubic-bezier(.55,.055,.675,.19) forwards;
    }

    @keyframes page-exit{
      to{opacity:0; transform:scale(1.02)}
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(4,8,18,0.95);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:200;
      place-items:center;
      opacity:0;
      transition:opacity 400ms cubic-bezier(.25,.46,.45,.94);
      overflow-y:auto;
      padding:20px;
    }

    .modal.active{
      display:grid;
      opacity:1;
    }

    .modal-content{
      background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border:1.5px solid rgba(255,255,255,0.15);
      border-radius:28px;
      padding:40px;
      max-width:700px;
      width:100%;
      transform:scale(0.9) translateY(30px);
      transition:transform 600ms cubic-bezier(.34,.46,.45,.94);
      max-height:90vh;
      overflow-y:auto;
    }

    .modal.active .modal-content{
      transform:scale(1) translateY(0);
    }

    .modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:32px;
    }

    .modal-bill-no{
      font-size:36px;
      font-weight:800;
      background:linear-gradient(135deg, #71e0ff, #b47bff);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .close-btn{
      width:40px;
      height:40px;
      border-radius:10px;
      background:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      border:1px solid rgba(255,255,255,0.1);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:all 300ms cubic-bezier(.34,.46,.45,.94);
      font-size:24px;
      color:var(--text);
    }

    .close-btn:hover{
      background:linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      transform:rotate(90deg);
    }

    .detail-section{
      margin-bottom:24px;
    }

    .detail-title{
      font-size:14px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:8px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .detail-value{
      font-size:18px;
      font-weight:600;
      color:var(--text);
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .progress-section{
      margin-top:32px;
      padding:20px;
      background:linear-gradient(135deg, rgba(255,180,120,0.2), rgba(255,120,180,0.2));
      border:1px solid rgba(255,180,120,0.3);
      border-radius:16px;
    }

    .progress-title{
      font-size:16px;
      font-weight:700;
      color:var(--text);
      margin-bottom:16px;
      text-align:center;
    }

    .progress-stats{
      display:flex;
      justify-content:space-around;
      margin-bottom:16px;
    }

    .progress-stat{
      text-align:center;
    }

    .progress-stat-value{
      font-size:32px;
      font-weight:800;
      background:linear-gradient(135deg, #71e0ff, #b47bff);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .progress-stat-label{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }

    .amount-display{
      text-align:center;
      padding:16px;
      background:linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      border-radius:12px;
      margin-top:16px;
    }

    .amount-label{
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .amount-value{
      font-size:36px;
      font-weight:800;
      background:linear-gradient(135deg, #ffba08, #ff006e);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .items-section{
      margin-top:24px;
      padding-top:24px;
      border-top:1px solid rgba(255,255,255,0.1);
    }

    .section-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:16px;
      color:var(--text);
    }

    .item-card{
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:14px;
      padding:20px;
      margin-bottom:16px;
      position:relative;
    }

    .item-card.completed{
      opacity:0.6;
      background:linear-gradient(135deg, rgba(140,255,207,0.1), rgba(63,230,167,0.05));
      border-color:rgba(140,255,207,0.3);
    }

    .item-card-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }

    .item-card-title{
      font-size:18px;
      font-weight:700;
      color:var(--text);
    }

    .item-info{
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
    }

    .item-ready-count{
      font-size:13px;
      color:var(--text);
      margin-top:8px;
      font-weight:600;
      padding:8px 12px;
      background:rgba(140,255,207,0.15);
      border-radius:8px;
      display:inline-block;
    }

    .btn-primary{
      padding:12px 32px;
      background:linear-gradient(135deg, rgba(120,220,255,0.3), rgba(180,120,255,0.3));
      border:1.5px solid rgba(120,220,255,0.4);
      color:var(--text);
      border-radius:12px;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:all 300ms;
      font-family:inherit;
    }

    .btn-primary:hover{
      background:linear-gradient(135deg, rgba(120,220,255,0.4), rgba(180,120,255,0.4));
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(120,220,255,0.3);
    }

    .modal-title{
      font-size:28px;
      font-weight:800;
      color:var(--text);
      margin-bottom:16px;
      text-align:center;
    }

    /* Payment Information Styles */
    .payment-info-section {
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(120,220,255,0.15), rgba(180,120,255,0.1));
      border: 1px solid rgba(120,220,255,0.3);
      border-radius: 16px;
    }

    .payment-info-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      text-align: center;
    }

    .payment-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .payment-detail {
      text-align: center;
      padding: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .payment-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .payment-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .advance-amount {
      color: #6bff9e;
    }

    .balance-amount {
      color: #ffba08;
    }

    .payment-method {
      color: #71e0ff;
    }

    .payment-status {
      color: #b47bff;
    }

    .balance-section {
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(255,180,120,0.2), rgba(255,120,180,0.2));
      border: 1px solid rgba(255,180,120,0.3);
      border-radius: 12px;
      text-align: center;
    }

    .balance-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .balance-value {
      font-size: 24px;
      font-weight: 800;
      color: #ffba08;
    }

    .paid-badge {
      display: inline-block;
      padding: 6px 12px;
      background: linear-gradient(135deg, rgba(100,255,150,0.3), rgba(63,230,167,0.2));
      border: 1px solid rgba(100,255,150,0.4);
      border-radius: 8px;

   async function loadStatusOrders(){
  const grid = document.getElementById('ordersGrid');
  const emptyState = document.getElementById('emptyState');

  try {
    // Get all bills and filter in JavaScript (Firestore doesn't support multiple != queries)
    const q = collection(db, 'bills');
    const querySnapshot = await getDocs(q);
    statusOrders = [];
    
    querySnapshot.forEach((doc) => {
      const orderData = doc.data();
      
      // Filter out delivered and cancelled bills in JavaScript
      if (orderData.status === 'Delivered' || orderData.status === 'Cancelled') {
        return; // Skip this bill
      }
      
      let totalItems = 0;
      let finishedItems = 0;
      
      if (orderData.items && Array.isArray(orderData.items)) {
        orderData.items.forEach(item => {
          const itemCount = item.count || 0;
          const readyCount = item.readyCount || 0;
          totalItems += itemCount;
          finishedItems += readyCount;
        });
      }
      
      // Calculate balance amount
      const totalAmount = orderData.totalAmount || 0;
      const advanceAmount = orderData.advanceAmount || 0;
      const balanceAmount = totalAmount - advanceAmount;
      
      statusOrders.push({
        id: doc.id,
        billNo: orderData.billNo || 'N/A',
        customerName: orderData.customerName || (currentLanguage === 'english' ? 'Unknown Customer' : 'அறியப்படாத வாடிக்கையாளர்'),
        mobileNo: orderData.mobileNo || 'N/A',
        billingDate: orderData.billingDate || null,
        deadlineDate: orderData.deadlineDate || null,
        totalAmount: totalAmount,
        advanceAmount: advanceAmount,
        balanceAmount: balanceAmount,
        paymentMethod: orderData.paymentMethod || 'Cash',
        items: orderData.items || [],
        totalItems: totalItems,
        finishedItems: finishedItems,
        status: orderData.status || 'Pending'
      });
    });

    statusOrders.sort((a, b) => {
      return b.billNo.localeCompare(a.billNo);
    });

    filteredOrders = [...statusOrders];
    displayOrders();
    updateSearchStats();

  } catch (error) {
    console.error('Error loading status orders:', error);
    grid.innerHTML = `<div class="loading">${currentLanguage === 'english' ? 'Error loading orders. Please check console for details.' : 'ஆர்டர்களை ஏற்றும் போது பிழை. விவரங்களுக்கு கன்சோல் சரிபார்க்கவும்.'}</div>`;
  }
}
   function getStatusBadge(status, finishedItems, totalItems) {
  const statusConfig = {
    'Pending': {
      english: 'Pending',
      tamil: 'நிலுவையில்',
      emoji: '⏳',
      color: 'rgba(255,180,120,0.3)',
      borderColor: 'rgba(255,180,120,0.4)'
    },
    'In Progress': {
      english: 'In Progress',
      tamil: 'முன்னேற்றத்தில்',
      emoji: '🔧',
      color: 'rgba(120,220,255,0.3)',
      borderColor: 'rgba(120,220,255,0.4)'
    },
    'Ready for Delivery': {
      english: 'Ready for Delivery',
      tamil: 'டெலிவரிக்கு தயார்',
      emoji: '📦',
      color: 'rgba(140,255,207,0.3)',
      borderColor: 'rgba(140,255,207,0.4)'
    }
  };

  // Auto-detect status based on progress if not explicitly set
  let actualStatus = status;
  if (!statusConfig[status]) {
    if (finishedItems === 0) {
      actualStatus = 'Pending';
    } else if (finishedItems === totalItems) {
      actualStatus = 'Ready for Delivery';
    } else {
      actualStatus = 'In Progress';
    }
  }

  const config = statusConfig[actualStatus] || statusConfig['Pending'];
  const statusText = currentLanguage === 'english' ? config.english : config.tamil;
  
  return `
    <span class="status-badge" style="background: linear-gradient(135deg, ${config.color}, ${config.color.replace('0.3', '0.2')}); border: 1px solid ${config.borderColor};">
      ${config.emoji} ${statusText}
    </span>
  `;
}

    function searchOrders() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

        filteredOrders = [...statusOrders];

        filteredOrders = statusOrders.filter(order =>

    function updateSearchStats() {
      const searchStats = document.getElementById('searchStats');

          searchStats.textContent = `${filteredOrders.length} நிலை ஆர்டர்கள் காட்டப்படுகின்றன`;
        }
      }
    }

    function formatDate(dateValue) {
      if (!dateValue) return currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை';
      
      try {
        let date;
        if (dateValue instanceof Timestamp) {
          date = dateValue.toDate();
        } else if (typeof dateValue === 'string') {
          date = new Date(dateValue);
        } else {
          date = new Date(dateValue);
        }
        
        if (isNaN(date.getTime())) return currentLanguage === 'english' ? 'Invalid date' : 'செல்லாத தேதி';
        
        return date.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      } catch (error) {
        return currentLanguage === 'english' ? 'Unknown date' : 'தேதி தெரியவில்லை';
      }
    }

    function showOrderDetail(billNo) {
  const order = statusOrders.find(o => o.billNo === billNo);
  if(!order) return;

  currentOrderId = order.id;
  currentOrder = order;

  document.getElementById('modalBillNo').textContent = order.billNo;
  document.getElementById('finishedCount').textContent = order.finishedItems;
  document.getElementById('totalCount').textContent = order.totalItems;
  document.getElementById('totalAmount').textContent = `₹${order.totalAmount}`;

  // Update payment information
  document.getElementById('advanceAmount').textContent = `₹${order.advanceAmount}`;
  document.getElementById('balanceAmount').textContent = `₹${order.balanceAmount}`;
  document.getElementById('paymentMethod').textContent = order.paymentMethod || 'Cash';
  
  // Update payment status
  const paymentStatus = order.balanceAmount === 0 ? 
    (currentLanguage === 'english' ? 'Paid' : 'செலுத்தப்பட்டது') : 
    (currentLanguage === 'english' ? 'Pending' : 'நிலுவையில்');
  document.getElementById('paymentStatus').textContent = paymentStatus;
  
  // Update amount to be paid
  document.getElementById('amountToBePaid').textContent = `₹${order.balanceAmount}`;

  if(order.items && order.items.length > 0) {
    displayItems(order.items);
  }

  document.getElementById('detailModal').classList.add('active');
}
   

    function displayItems(items) {
      const itemsList = document.getElementById('itemsList');
      
      const countText = currentLanguage === 'english' ? 'Count' : 'எண்ணிக்கை';
      const priceText = currentLanguage === 'english' ? 'Price per item' : 'ஒரு பொருளின் விலை';
      const subtotalText = currentLanguage === 'english' ? 'Subtotal' : 'துணைத்தொகை';
      const readyText = currentLanguage === 'english' ? 'Ready' : 'தயார்';
      const completedText = currentLanguage === 'english' ? 'Completed!' : 'முடிந்தது!';
      const noItemsReadyText = currentLanguage === 'english' ? 'No items ready yet' : 'இன்னும் எந்த பொருளும் தயாரில்லை';

      let itemsHTML = '';

      items.forEach((item, index) => {
        const readyCount = item.readyCount || 0;
        const isCompleted = readyCount >= item.count;
        
        itemsHTML += `
          <div class="item-card ${isCompleted ? 'completed' : ''}">
            <div class="item-card-header">
              <div class="item-card-title">${item.type.charAt(0).toUpperCase() + item.type.slice(1)}</div>
            </div>
            <div class="item-info"><strong>${countText}:</strong> ${item.count}</div>
            <div class="item-info"><strong>${priceText}:</strong> ₹${item.price}</div>
            <div class="item-info"><strong>${subtotalText}:</strong> ₹${item.total}</div>
            ${readyCount > 0 ? 
              `<div class="item-ready-count">${isCompleted ? '✓ ' + completedText : readyText + ': ' + readyCount + '/' + item.count}</div>` : 
              `<div class="item-info" style="color:rgba(255,180,120,0.8); font-style:italic;">${noItemsReadyText}</div>`
            }
          </div>
        `;
      });

      itemsList.innerHTML = itemsHTML;
    }

    document.getElementById('searchBtn').addEventListener('click', searchOrders);
    
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') {
        searchOrders();
      }
    });

    document.getElementById('searchInput').addEventListener('input', () => {
      if(document.getElementById('searchInput').value.trim() === '') {
        searchOrders();
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('active');
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if(e.target.id === 'detailModal'){
        document.getElementById('detailModal').classList.remove('active');
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      document.body.classList.add('transitioning');
      setTimeout(() => window.location.href = 'index.html', 600);
    });

    loadStatusOrders();
    loadAllStatusBills();
  </script>
</body>
